<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>退租证据比对工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f5;color:#19332f;font:15px system-ui}header{background:#163f38;color:white;padding:24px 4%;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}small{opacity:.7}main{max-width:1400px;margin:auto;padding:25px}button,select,input,textarea{font:inherit;padding:10px;border:1px solid #c7d5d1;border-radius:7px;background:white;color:#19332f}button{cursor:pointer}button:hover{background:#e0eeea}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.card{background:white;border:1px solid #dbe4e1;border-radius:12px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.drop{border:2px dashed #b9cec6;min-height:135px;padding:15px;border-radius:8px;background:#f8fbfa}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{width:110px;height:90px;object-fit:cover;cursor:zoom-in}textarea{width:100%;min-height:75px}label{display:block;margin:10px 0 6px;font-size:13px;color:#53716a}.pill{background:#e4eee9;padding:6px 12px;border-radius:20px}.note{color:#62766f;font-size:13px}dialog{width:94vw;max-width:1400px}dialog img{max-width:100%;max-height:75vh;object-fit:contain}dialog .grid>div{overflow:auto}footer{padding:20px;color:#64766f}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{header,.bar,.tools,.note,dialog{display:none!important}body{background:white}.card{break-inside:avoid}.photos img{width:200px;height:150px}}
</style><header><div><small>PROPERTY OPERATIONS / EVIDENCE REVIEW</small><h1>退租证据比对工作台</h1></div><span>Junior CM → CM → 租客报告</span></header><main><div class="card"><input id="address" style="width:100%" placeholder="物业地址"><div class="bar"><label>本次退租日期 <input id="current" type="date"></label><label>之前报告日期（待确认） <input id="previous" type="date"></label><label>工作视角 <select id="role"><option>Junior CM</option><option>CM</option></select></label></div><p class="note">本地版本 · 自动保存在此浏览器 · 请定期下载备份。角色切换为工作视角，不是账号权限。照片会压缩为最长边 1600px；原始照片请另行留存。</p><span id="stats"></span></div><div class="bar"><select id="area"></select><select id="status"><option>全部状态</option><option>待审核</option><option>租客责任</option><option>原有问题</option><option>合理损耗</option><option>维修跟进</option><option>证据不足</option></select><input id="search" placeholder="搜索设施、说明、备注"><button id="add">＋ 新增项目</button><button id="backup">下载完整备份</button><button onclick="document.getElementById('restore').click()">导入备份</button><input id="restore" type="file" accept=".json" hidden><button id="report">导出租客报告</button></div><p class="note">拖入或选择多张图片；点击缩略图打开前后对照。误添加的项目可点击“删除项目”；正常审核项目请保留记录。租客报告仅包含 CM 已审核的“租客责任”项目。</p><div id="list"></div><footer id="message" role="status"></footer></main><dialog id="viewer"><button onclick="viewer.close()">关闭对照</button><div class="grid" id="large"></div></dialog><script>
const seed=[];
let db,model={address:"",current:'',previous:'',items:seed};
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const areas=['Entry','Lounge','Kitchen','Bedroom 1','Bedroom 2','Bathroom','Bathroom 2','Laundry','Furniture','General','Balcony'];
function msg(t){$('message').textContent=t}function save(){return new Promise((res,rej)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(model,'case');t.oncomplete=()=>{msg('已自动保存 · '+new Date().toLocaleTimeString());res()};t.onerror=()=>{msg('保存失败，请立即下载备份：'+t.error);rej(t.error)}})}
let req=indexedDB.open('inspection-review-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onerror=()=>msg('无法开启本地存储，请允许浏览器存储后重新打开');req.onsuccess=()=>{db=req.result;let r=db.transaction('data').objectStore('data').get('case');r.onsuccess=()=>{if(r.result)model=r.result;init()}};
function init(){for(let k of ['address','current','previous']){$(k).value=model[k];$(k).onchange=()=>{model[k]=$(k).value;save()}}$('area').innerHTML='<option>全部区域</option>'+[...new Set([...areas,...model.items.map(i=>i.area)])].map(a=>`<option>${esc(a)}</option>`).join('');render()}
function select(k,opts,i){return `<select data-id="${i.id}" data-key="${k}">${opts.map(v=>`<option ${i[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function render(){let rows=model.items.filter(i=>($('area').value==='全部区域'||i.area===$('area').value)&&($('status').value==='全部状态'||i.decision===$('status').value)&&JSON.stringify(i).toLowerCase().includes($('search').value.toLowerCase()));$('stats').textContent=`${model.items.length} 个项目 · ${model.items.filter(i=>i.decision==='待审核').length} 待审核 · ${model.items.filter(i=>i.decision==='租客责任').length} 已确认租客责任`;$('list').innerHTML=rows.map(i=>`<article class="card"><div class="bar"><span class="pill">${esc(i.area)}</span><strong>${esc(i.item)}</strong><span>${esc(i.kind)}</span><span class="pill">${esc(i.decision)}</span><button type="button" data-delete="${esc(i.id)}" style="margin-left:auto;color:#a33232">删除项目</button></div><label>设施 / 位置</label><input data-id="${i.id}" data-key="item" value="${esc(i.item)}"><label>问题类型</label>${select('kind',['清洁','损坏','无法工作','维修','其他'],i)}<label>本次问题说明</label><textarea data-id="${i.id}" data-key="description">${esc(i.description)}</textarea><div class="grid">${['after','before'].map(k=>`<div><label>${k==='after'?'本次退租照片':'之前同一位置照片'}</label><div class="drop" data-id="${i.id}" data-side="${k}"><input type="file" accept="image/*" multiple data-id="${i.id}" data-side="${k}"><p class="note">可拖拽多张照片到这里</p><div class="photos">${i[k].map((p,n)=>`<div><img loading="lazy" src="${p}" data-view="${i.id}" alt="${k==='after'?'本次':'之前'}照片 ${n+1}"><button data-remove="${i.id}" data-side="${k}" data-n="${n}" aria-label="移除此照片">×</button></div>`).join('')}</div></div></div>`).join('')}</div><label>Junior CM 比对结论</label>${select('finding',['待核实','之前已有','之前未见','缺少同位置照片','疑似加重'],i)}<label>Junior CM 备注 / 报告页码 / 照片编号</label><textarea data-id="${i.id}" data-key="junior">${esc(i.junior)}</textarea>${$('role').value==='CM'?`<hr><label>CM 审核决定</label>${select('decision',['待审核','租客责任','原有问题','合理损耗','维修跟进','证据不足'],i)}<label>CM 对外说明（进入租客报告）</label><textarea data-id="${i.id}" data-key="cm">${esc(i.cm)}</textarea><label>拟定金额 AUD（可留空）</label><input type="number" min="0" step="0.01" data-id="${i.id}" data-key="amount" value="${esc(i.amount)}">`:''}</article>`).join('')||'<div class="card">此筛选下没有项目</div>'}
for(let k of ['area','status','role'])$(k).onchange=render;$('search').oninput=render;
$('list').onchange=async e=>{let el=e.target,i=model.items.find(i=>i.id===el.dataset.id);if(!i)return;if(el.type==='file'){await upload(i,el.dataset.side,el.files);return}if(el.dataset.key){if(el.dataset.key==='amount'&&Number(el.value)<0)return; i[el.dataset.key]=el.value;await save();if(el.dataset.key==='decision')render()}};
async function upload(i,k,files){try{for(let f of files){if(!f.type.startsWith('image/'))continue;if(f.size>30*1024*1024)throw Error('单张图片不得超过30MB');let bitmap=await createImageBitmap(f),ratio=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=bitmap.width*ratio;c.height=bitmap.height*ratio;c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);i[k].push(c.toDataURL('image/jpeg',.82));bitmap.close()}await save();render()}catch(e){msg('图片处理失败：'+e.message)}}
$('list').ondragover=e=>{if(e.target.closest('.drop'))e.preventDefault()};$('list').ondrop=e=>{let d=e.target.closest('.drop');if(d){e.preventDefault();upload(model.items.find(i=>i.id===d.dataset.id),d.dataset.side,e.dataTransfer.files)}};
$('list').onclick=async e=>{let d=e.target.dataset;if(d.delete){let index=model.items.findIndex(i=>i.id===d.delete);if(index<0)return;let item=model.items[index];if(!confirm('确定删除误添加的项目「'+item.area+' / '+item.item+'」吗？该项目的照片和备注也会一起删除。正常审核项目请使用 CM 审核决定保留记录。'))return;model.items.splice(index,1);try{await save();render();msg('项目已删除并保存')}catch(err){model.items.splice(index,0,item);render();msg('删除未保存，项目已恢复。请下载备份后重试。')}return;}if(d.view){let i=model.items.find(i=>i.id===d.view);$('large').innerHTML=['after','before'].map(k=>`<div><h3>${k==='after'?'本次退租':'之前报告'}</h3>${i[k].map(p=>`<img src="${p}" alt="对照照片">`).join('')||'暂无照片'}</div>`).join('');$('viewer').showModal()}if(d.remove){let i=model.items.find(i=>i.id===d.remove);i[d.side].splice(+d.n,1);save();render()}};
$('add').onclick=()=>{let area=$('area').value==='全部区域'?'Entry':$('area').value;model.items.unshift({id:crypto.randomUUID(),area,item:'新增设施',kind:'清洁',description:'',junior:'',finding:'待核实',decision:'待审核',cm:'',amount:'',before:[],after:[]});$('status').value='全部状态';$('search').value='';save();render()};
function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('backup').onclick=()=>download(JSON.stringify(model),'inspection-backup.json','application/json');$('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.items)||v.items.some(i=>!i.id||!Array.isArray(i.before)||!Array.isArray(i.after)||[...i.before,...i.after].some(p=>typeof p!=='string'||!p.startsWith('data:image/jpeg;base64,'))))throw Error('备份格式不正确');if(!confirm('导入将替换当前数据。请先保存当前备份。继续？'))return;model=v;await save();init()}catch(err){msg('导入失败：'+err.message)}};
$('report').onclick=()=>{let rows=model.items.filter(i=>i.decision==='租客责任');if($('role').value!=='CM'){msg('请切换 CM 视角审核后导出');return}if(!rows.length){msg('没有已确认租客责任的项目');return}if(rows.some(i=>!i.cm.trim()||!i.before.length||!i.after.length)){msg('导出前请补齐已确认项目的前后照片与 CM 对外说明');return}let html=`<!doctype html><meta charset="utf-8"><title>Inspection comparison report</title><style>body{font:16px Arial;max-width:1000px;margin:40px auto;color:#243b35}article{border-bottom:1px solid #ccc;padding:20px;break-inside:avoid}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;max-height:400px;object-fit:contain}p{white-space:pre-wrap}@media print{button{display:none}}</style><button onclick="print()">Print / Save as PDF</button><h1>Inspection comparison report</h1><p>${esc(model.address)}</p><p>Current: ${esc(model.current)} · Previous: ${esc(model.previous)}</p>`+rows.map(i=>`<article><h2>${esc(i.area)} / ${esc(i.item)}</h2><p>${esc(i.description)}</p><p>${esc(i.cm)}</p>${i.amount!==''?`<p>Proposed amount: AUD ${esc(i.amount)}</p>`:''}<div class="grid">${['after','before'].map(k=>`<div><h3>${k==='after'?'Current inspection':'Previous inspection'}</h3>${i[k].map(p=>`<img src="${p}">`).join('')}</div>`).join('')}</div></article>`).join('');download(html,'tenant-comparison-report.html','text/html')};
</script></html>
